<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
    fontconfig is always the root component
    can contain <dir>, <cachedir>, <include>, <match> and <alias> elements in any order.
-->
<fontconfig>
  <!-- private font directory  -->
  <dir prefix="xdg">fonts</dir>
  <!-- configuration includes
         If 'ignore_missing' is set to "yes" instead of the default "no", a missing file or directory will elicit no warning message from the library. If 'prefix' is set to "xdg", the value in the XDG_CONFIG_HOME environment variable will be added as the path prefix. please see XDG Base Directory Specification for more details.
    -->
  <include ignore_missing="yes" prefix="xdg">fonts</include>
  <!-- contains a directory name that is supposed to be stored or read the cache of font information. -->
  <cachedir prefix="xdg">cache</cachedir>
</fontconfig>

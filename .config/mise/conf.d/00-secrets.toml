# Secrets live in pass (PASSWORD_STORE_DIR=~/.local/share/pass, entries under env/).
# Never store values in this file. Guarded so a missing entry yields "" instead of
# breaking shell activation in non-interactive/login contexts.

redactions = ["*_KEY", "*_TOKEN"]

[env]
GITHUB_TOKEN = "{{ exec(command='PASSWORD_STORE_DIR=$HOME/.local/share/pass pass show env/GITHUB_TOKEN 2>/dev/null || true') }}"
ANTHROPIC_API_KEY = "{{ exec(command='PASSWORD_STORE_DIR=$HOME/.local/share/pass pass show env/ANTHROPIC_API_KEY 2>/dev/null || true') }}"
TAVILY_API_KEY = "{{ exec(command='PASSWORD_STORE_DIR=$HOME/.local/share/pass pass show env/TAVILY_API_KEY 2>/dev/null || true') }}"
OPENROUTER_API_KEY = "{{ exec(command='PASSWORD_STORE_DIR=$HOME/.local/share/pass pass show env/OPENROUTER_API_KEY 2>/dev/null || true') }}"

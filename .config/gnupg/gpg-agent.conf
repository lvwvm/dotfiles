# gpg-agent.conf — active settings minimal; defaults documented for reference.
# See gpg-agent(1). Apply changes with: gpgconf --reload gpg-agent

# Use gpg-agent as the SSH agent (keys enabled in $GNUPGHOME/sshcontrol).
enable-ssh-support

# Pin smartcard daemon binary path.
scdaemon-program /usr/lib/gnupg/scdaemon

### Defaults (commented; uncomment to override) ###
# Pinentry program for passphrase prompts (default: system pinentry).
#pinentry-program /usr/bin/pinentry
# Seconds a cached passphrase stays valid after last use (default: 600).
#default-cache-ttl 600
# Hard maximum lifetime of a cached passphrase (default: 7200).
#max-cache-ttl 7200
# Same pair for SSH keys (defaults: 1800 / 7200).
#default-cache-ttl-ssh 1800
#max-cache-ttl-ssh 7200
# Let Emacs act as pinentry (default: disabled).
#allow-emacs-pinentry
# Allow gpg-preset-passphrase to seed the cache (default: disabled).
#allow-preset-passphrase
# Refuse clients marking keys trusted; trustlist.txt only (default: allowed).
#no-allow-mark-trusted
